name: Clerk foreclosure and unclaimed lists
on: [pull_request]
permissions:
  contents: read
jobs:
  clerk-lists-chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.56.0 cryptography==44.0.0 pypdf==5.1.0
          python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          import base64, json, sys
          sys.path.insert(0, 'discovery')
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          from publish_private import seal
          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          open('test-private-key.txt', 'w').write(base64.b64encode(key.private_bytes(serialization.Encoding.DER, serialization.PrivateFormat.PKCS8, serialization.NoEncryption())).decode())
          pem = key.public_key().public_bytes(serialization.Encoding.PEM, serialization.PublicFormat.SubjectPublicKeyInfo)
          unclaimed = {'Volusia': {'status': 'ok', 'records': [{'county': 'Volusia', 'name': 'JANE TESTER', 'reference': '153969', 'date': '2024-07-11', 'category': 'POOLED CASH', 'amount': 177.0, 'source': 'https://www.clerk.org/pdf/notices/2026-Unclaimed-Payments-Notice.pdf'}]}}
          json.dump(seal({'fetchedAt': '2026-11-27T00:00:00Z', 'unclaimed': unclaimed, 'surplusNames': {'Pasco': {'2023-0045': 'DOE JOHN'}}}, pem), open('county-private.json', 'w'))
          sales = {'Osceola': {'status': 'ok', 'records': [{'county': 'Osceola', 'caseNo': '2025 CA 000001 MF', 'saleDate': '2099-12-01', 'plaintiff': 'TEST BANK NA', 'source': 'https://courts.osceolaclerk.com/reports/CivilMortgageForeclosuresWeb.pdf'},
                                                      {'county': 'Osceola', 'caseNo': '2024 CA 000009 MF', 'saleDate': '2025-01-15', 'plaintiff': 'OLD BANK', 'dropped': True, 'source': 'https://courts.osceolaclerk.com/reports/CivilMortgageForeclosuresWeb.pdf'}]}}
          counties = {'Pasco': {'status': 'ok', 'records': [{'taxDeedId': '2023-0045', 'reportedBalance': 23011.34, 'parcelId': '21-25-17-0110-19700-0070', 'source': 'https://app.pascoclerk.com/report.xlsx'}]}}
          json.dump({'fetchedAt': '2026-11-27T00:00:00Z', 'counties': counties, 'foreclosureSales': sales}, open('county-discovery.json', 'w'))
          PY
          python -m http.server 8754 &
          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright, expect
          private_key = open('test-private-key.txt').read()
          with sync_playwright() as p:
           b = p.chromium.launch(args=['--no-sandbox'])
           page = b.new_page()
           errors = []
           page.on('pageerror', lambda e: errors.append(str(e)))
           page.route('https://unpkg.com/**', lambda r: r.abort())
           page.route('https://jfmedjpcvbwmkytdjbmm.supabase.co/rest/v1/report_keys**', lambda r: r.fulfill(status=200, headers={'Access-Control-Allow-Origin': '*'}, content_type='application/json', body=json.dumps([{'private_key': private_key}])))
           def parcels(route):
               match = 'LIKE' in route.request.url
               attrs = {'PARCEL_ID': 'OTHER-1' if match else '21-25-17-0110-19700-0070', 'CO_NO': 61, 'OWN_NAME': 'DOE JOHN' if match else 'SNF FUND LLC',
                        'OWN_ADDR1': '1 MAIN ST' if match else 'PO BOX 46189', 'OWN_CITY': 'TAMPA', 'OWN_STATE': 'FL', 'OWN_ZIPCD': 33602, 'PHY_ADDR1': '5 OAK AVE', 'PHY_CITY': 'DADE CITY'}
               route.fulfill(status=200, headers={'Access-Control-Allow-Origin': '*'}, content_type='application/json', body=json.dumps({'features': [{'attributes': attrs}]}))
           page.route('https://services9.arcgis.com/**', parcels)
           page.goto('http://localhost:8754')
           page.evaluate("go('foreclosure')")
           expect(page.locator('#fcSalesStatus')).to_contain_text('1 scheduled sales in Osceola County')
           expect(page.locator('#fcSalesList')).to_contain_text('TEST BANK NA')
           page.locator('#fcSalesList').get_by_role('button', name='Track case').click()
           expect(page.locator('#foreclosureWatchList')).to_contain_text('2025 CA 000001 MF')
           expect(page.locator('#fcSalesList').get_by_role('button', name='Tracked')).to_be_disabled()
           expect(page.locator('#foreclosureWatchStatus')).to_contain_text('Added 2025 CA 000001 MF to Your tracked cases')
           page.evaluate("go('county-funds')")
           page.select_option('#countyFundsBrowse', 'Volusia')
           expect(page.locator('#unclaimedNamedReport')).to_contain_text('Sign in under Settings')
           expect(page.locator('#unclaimedNamedReport').get_by_role('button', name='Go to Settings to sign in')).to_be_visible()
           assert page.locator('#countyFundsBrowse optgroup[label="Counties with name lists"] option').all_text_contents()[0].endswith('(names list)')
           page.evaluate("cloudSession = {access_token: 't', refresh_token: 'r', user: {id: 'u'}, expires_at: Date.now() / 1000 + 3600}")
           page.select_option('#countyFundsBrowse', 'Polk')
           expect(page.locator('#unclaimedNamedReport')).to_contain_text('does not publish an unclaimed-money list')
           page.select_option('#countyFundsBrowse', 'Volusia')
           expect(page.locator('#unclaimedNamedReport')).to_contain_text('JANE TESTER')
           expect(page.locator('#unclaimedNamedReport')).to_contain_text('1 names')
           expect(page.locator('#unclaimedNamedReport').get_by_role('button', name='Search')).to_be_visible()
           page.get_by_label('Search names').fill('nobody')
           expect(page.locator('#unclaimedNamedReport')).to_contain_text('No matching records')
           page.evaluate("go('surplus')")
           expect(page.locator('#foreclosureSurplusReview')).to_contain_text('2024 CA 000009 MF')
           expect(page.locator('#foreclosureSurplusReview')).to_contain_text('confirm the result')
           page.select_option('#discoveryCounty', 'Pasco')
           expect(page.locator('#discoveryResults')).to_contain_text('Former owner on clerk report: DOE JOHN')
           page.locator('#discoveryResults').get_by_role('button', name='Find owner').click()
           expect(page.locator('#discoveryResults')).to_contain_text('Property record now lists SNF FUND LLC')
           expect(page.locator('#discoveryResults')).to_contain_text('Owner-name match: DOE JOHN')
           expect(page.locator('#discoveryResults')).to_contain_text('skip-tracing')
           page.locator('#discoveryResults').get_by_role('button', name='Add to my cases').click()
           expect(page.locator('#discoveryResults').get_by_role('button', name='In my cases')).to_be_disabled()
           expect(page.locator('#surplusList')).to_contain_text('2023-0045')
           expect(page.locator('#claimPipeline')).to_contain_text('Researching: ')
           signed = {'id': '11111111-2222-3333-4444-555555555555', 'title': 'Surplus Funds Recovery Services Agreement', 'signer_name': 'DOE JOHN', 'case_key': '2023-0045',
                     'status': 'signed', 'signed_at': '2026-11-28T12:00:00Z', 'created_at': '2026-11-28T11:00:00Z'}
           def signatures(route):
               body = [{'id': signed['id']}] if route.request.method == 'POST' else [signed]
               route.fulfill(status=200, headers={'Access-Control-Allow-Origin': '*'}, content_type='application/json', body=json.dumps(body))
           page.route('https://jfmedjpcvbwmkytdjbmm.supabase.co/rest/v1/signature_requests**', signatures)
           page.evaluate("go('contracts')")
           expect(page.locator('#ddSignList')).to_contain_text('Signed')
           page.evaluate("""() => { const f = document.getElementById('ddDocForm');
             const values = {client: 'DOE JOHN', caseNo: '2023-0045', county: 'Pasco', property: '5 OAK AVE', saleDate: '2026-01-01', salePrice: '50000', surplus: '23011', assessed: '90000', debt: '0', feePct: '10'};
             for (const [name, value] of Object.entries(values)) if (f.elements[name]) f.elements[name].value = value; }""")
           page.get_by_role('button', name='Send for e-signature').click()
           expect(page.locator('#ddSignLink')).to_contain_text('Signing link for DOE JOHN')
           assert page.get_by_label('Signing link').input_value().endswith('/sign.html?id=11111111-2222-3333-4444-555555555555')
           page.evaluate("go('surplus')")
           expect(page.locator('#claimPipeline')).to_contain_text('Agreement signed: 1')
           sign_state = {'status': 'sent'}
           def sign_rpc(route):
               if route.request.url.endswith('get_signature_request'):
                   done = sign_state['status'] == 'signed'
                   body = [{'title': 'Surplus Funds Recovery Services Agreement', 'document_html': '<html><body><h1>Agreement</h1><p class="noprint"><button>Print</button></p></body></html>',
                            'signer_name': 'DOE JOHN', 'status': sign_state['status'], 'signature': sign_state.get('signature'),
                            'signed_name': 'DOE JOHN' if done else None, 'signed_at': '2026-11-28T12:00:00Z' if done else None}]
               else:
                   payload = json.loads(route.request.post_data)
                   assert payload['signature_png'].startswith('data:image/png;base64,') and payload['typed_name'] == 'DOE JOHN'
                   sign_state.update(status='signed', signature=payload['signature_png'])
                   body = True
               route.fulfill(status=200, headers={'Access-Control-Allow-Origin': '*'}, content_type='application/json', body=json.dumps(body))
           signer = b.new_page()
           signer.on('pageerror', lambda e: errors.append(str(e)))
           signer.route('https://jfmedjpcvbwmkytdjbmm.supabase.co/rest/v1/rpc/**', sign_rpc)
           signer.goto('http://localhost:8754/sign.html?id=11111111-2222-3333-4444-555555555555')
           expect(signer.locator('#status')).to_contain_text('Prepared for DOE JOHN')
           signer.get_by_role('button', name='Sign document').click()
           expect(signer.locator('#status')).to_contain_text('Draw your signature')
           box = signer.locator('#pad').bounding_box()
           signer.mouse.move(box['x'] + 20, box['y'] + 30)
           signer.mouse.down()
           signer.mouse.move(box['x'] + 160, box['y'] + 60, steps=8)
           signer.mouse.up()
           signer.get_by_label('I agree to sign').check()
           signer.get_by_role('button', name='Sign document').click()
           expect(signer.locator('#status')).to_contain_text('Signed by DOE JOHN')
           expect(signer.locator('#signing')).to_be_hidden()
           assert not errors, errors
           restored = b.new_page()
           restored.on('pageerror', lambda e: errors.append(str(e)))
           restored.route('https://unpkg.com/**', lambda r: r.abort())
           restored.route('https://jfmedjpcvbwmkytdjbmm.supabase.co/rest/v1/**', lambda r: r.fulfill(status=200, headers={'Access-Control-Allow-Origin': '*'}, content_type='application/json', body='[]'))
           restored.route('https://jfmedjpcvbwmkytdjbmm.supabase.co/rest/v1/report_keys**', lambda r: r.fulfill(status=200, headers={'Access-Control-Allow-Origin': '*'}, content_type='application/json', body=json.dumps([{'private_key': private_key}])))
           restored.route('https://jfmedjpcvbwmkytdjbmm.supabase.co/auth/v1/token**', lambda r: r.fulfill(status=200, headers={'Access-Control-Allow-Origin': '*'}, content_type='application/json', body=json.dumps({'access_token': 't2', 'refresh_token': 'r2', 'expires_in': 3600, 'user': {'id': 'u', 'email': 'owner@example.com'}})))
           restored.goto('http://localhost:8754')
           restored.evaluate("localStorage.setItem('realdealspro_session', 'r1')")
           restored.reload()
           restored.wait_for_function("cloudSession && cloudSession.refresh_token === 'r2'")
           assert restored.evaluate("localStorage.getItem('realdealspro_session')") == 'r2'
           restored.evaluate("go('county-funds')")
           restored.select_option('#countyFundsBrowse', 'Volusia')
           expect(restored.locator('#unclaimedNamedReport')).to_contain_text('JANE TESTER')
           assert not errors, errors
           print('Clerk list checks passed')
          PY
