name: RealDealsPro county discovery
on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - sw.js
      - property-search.js
      - deal-desk.js
      - outreach.js
      - 'icons/**'
      - 'discovery/**'
      - .github/workflows/county-pages.yml
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * 1,4'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: realdeals-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || vars.COUNTY_SCAN_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install workbook reader
        run: python -m pip install openpyxl==3.1.5 pypdf==5.1.0
      - uses: actions/configure-pages@v5
      - name: Build site and county queue
        run: |
          (cd discovery && python -m unittest test_georgia test_counties)
          mkdir site
          cp -r index.html CNAME manifest.webmanifest sw.js property-search.js deal-desk.js outreach.js icons site/
          python discovery/publish.py > site/county-discovery.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" | jq -e --arg name "$ARTIFACT_NAME" '.artifacts | any(.name == $name and .expired == false)' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact metadata did not become available."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
