name: Polk parcel search browser checks
on:
  pull_request:
    paths: [index.html, .github/workflows/polk-parcel-search.yml]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8752 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright, expect
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width':390,'height':800})
              errors = []
              page.on('pageerror', lambda error: errors.append(str(error)))
              page.goto('http://localhost:8752')
              page.get_by_role('button', name='Find deals', exact=True).click()
              page.get_by_role('button', name='Polk parcels', exact=True).click()
              search = page.get_by_role('button', name='Search parcels')
              status = page.locator('#parcelSearchStatus')
              search.click()
              expect(status).to_contain_text('Enter a city')
              page.locator('#parcelSearchForm [name=city]').fill('Bartow')
              page.select_option('#parcelSearchForm [name=use]', 'vacant')
              search.click()
              first = page.locator('#parcelSearchResults article').first
              expect(first).to_contain_text('Vacant', timeout=20000)
              official = first.get_by_role('link', name='Official GIS record')
              response = page.request.get(official.get_attribute('href'))
              assert response.ok and len(response.json()['features']) == 1
              first.get_by_role('button', name='Save as lead').click()
              expect(status).to_contain_text('Acceptance Score 0/100')
              first.get_by_role('button', name='Save as lead').click()
              expect(status).to_contain_text('already saved')
              page.reload()
              page.get_by_role('button', name='Find deals', exact=True).click()
              page.get_by_role('button', name='Saved leads', exact=True).click()
              page.select_option('#fLeadType','vacant-land')
              card = page.locator('#leadsList .lead')
              expect(card).to_have_count(1)
              expect(card).to_contain_text('Acceptance 0/100')
              expect(card.get_by_role('link', name='Official Polk parcel record')).to_be_visible()
              page.get_by_role('button', name='Find deals', exact=True).click()
              page.get_by_role('button', name='Polk parcels', exact=True).click()
              page.locator('#parcelSearchForm [name=parcel]').fill('233012000000011010')
              search.click()
              expect(first).to_contain_text('233012000000011010', timeout=20000)
              page.route('https://gis.polkfl.gov/**', lambda route: route.abort())
              search.click()
              expect(status).to_contain_text('unavailable')
              expect(first).to_have_count(0)
              expect(search).to_be_enabled()
              page.unroute('https://gis.polkfl.gov/**')
              page.locator('#parcelSearchForm [name=parcel]').fill('')
              page.locator('#parcelSearchForm [name=zip]').fill('33830')
              page.select_option('#opportunityType','vacant')
              search.click()
              expect(first).to_contain_text('Vacant', timeout=20000)
              page.select_option('#opportunityType','foreclosure')
              case = page.locator('#opportunityCaseForm')
              for key,value in {'caseNo':'TEST-FIND','property':'Test property','source':'https://www.polkclerkfl.gov/169/Foreclosure-Sales'}.items():
                  case.locator('[name='+key+']').fill(value)
              case.get_by_role('button',name='Prefill case review').click()
              watch = page.locator('#foreclosureWatchForm')
              expect(watch.locator('[name=caseNo]')).to_have_value('TEST-FIND')
              expect(watch.locator('[name=county]')).to_have_value('Polk')
              watch.locator('[name=stage]').select_option('Sale completed')
              watch.get_by_role('button',name='Save case status').click()
              page.get_by_role('button',name='Find deals',exact=True).click()
              page.get_by_role('button',name='Daily review',exact=True).click()
              expect(page.locator('#dailyReview')).to_contain_text('TEST-FIND')
              page.locator('#dailyReview').get_by_role('button',name='Surplus review').click()
              expect(page.locator('#foreclosureSurplusReview')).to_contain_text('TEST-FIND')
              page.get_by_role('button', name='Find deals', exact=True).click()
              page.get_by_role('button', name='Polk parcels', exact=True).click()
              page.select_option('#opportunityType','probate')
              for key,value in {'caseNo':'TEST-PROBATE','property':'233012000000011010','source':'https://pro.polkcountyclerk.net/PRO'}.items():
                  case.locator('[name='+key+']').fill(value)
              case.get_by_role('button',name='Prefill case review').click()
              research = page.locator('#leadResearchForm')
              expect(research.locator('[name=probateCase]')).to_have_value('TEST-PROBATE')
              research.locator('[name=probateEvidence]').fill('Test parcel connection')
              research.get_by_role('button',name='Save research').click()
              expect(page.locator('#leadsList')).to_contain_text('Probate review TEST-PROBATE')
              assert not errors, errors
              print('Live Polk search, official lookup, scoring, deduplication, reload and outage recovery passed')
          PY
