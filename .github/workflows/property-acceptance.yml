name: Property acceptance browser checks
on: [pull_request]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8752 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright, expect
          with sync_playwright() as p:
           b=p.chromium.launch(args=['--no-sandbox'])
           page=b.new_page(viewport={'width':390,'height':800})
           errors=[]
           page.on('pageerror',lambda e:errors.append(str(e)))
           page.on('dialog',lambda d:d.accept())
           page.goto('http://localhost:8752')
           page.evaluate("go('leads')")
           page.fill('#nAddr','Test Parcel 000')
           page.fill('#nEquity','65')
           page.select_option('#nType','Vacant Land')
           for x in ('nVacant','nTax','nFore','nAbsentee'):
            page.check('#'+x)
           page.evaluate('addLead()')
           page.select_option('#fLeadType','vacant-land')
           card=page.locator('#leadsList .lead')
           expect(card).to_have_count(1)
           expect(card).to_contain_text('Acceptance 100/100')
           expect(card).to_contain_text('Foreclosure reported (+25)')
           card.get_by_role('button',name='Vault').click()
           page.evaluate("go('vault')")
           expect(page.locator('#vaultList')).to_contain_text('Test Parcel 000')
           page.reload()
           page.evaluate("go('kanban')")
           expect(page.locator('#kanban')).to_contain_text('Acceptance 100/100')
           page.evaluate("go('foreclosure')")
           form=page.locator('#foreclosureWatchForm')
           for name,value in {'county':'Polk','caseNo':'TEST-01','property':'Test Parcel 000','source':'https://www.polkclerkfl.gov/'}.items():
            form.locator('[name='+name+']').fill(value)
           form.locator('[name=stage]').select_option('Sale completed')
           form.get_by_role('button').click()
           page.evaluate("go('surplus')")
           expect(page.locator('#foreclosureSurplusReview')).to_contain_text('TEST-01')
           assert page.locator('a',has_text='Duval mortgage foreclosure owner claim').count()==1
           for tab in ['dashboard','leads','foreclosure','kanban','vault','surplus','county-funds','investors','contracts','scripts','settings']:
            page.evaluate('go',tab)
            expect(page.locator('#view-'+tab)).to_be_visible()
           assert page.evaluate("scoreOf({equity:59,fore:true})")==25
           assert page.evaluate("scoreOf({equity:null})")==0
           assert not errors,errors
           print('Mobile browser checks passed')
          PY
